services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}

  web:
    build: .
    container_name: blackbox-web
    restart: unless-stopped

    ports:
      - "8000:80"

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"

    depends_on:
      mysql:
        condition: service_started

    volumes:
      - .:/var/www/html

volumes:
  mysql_data: